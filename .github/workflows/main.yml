# Linode APL default Workflow
# Required repository/environment secrets:
#   OCI_USERNAME              - registry login username
#   DOCKERHUB_LINODEBOT_TOKEN - registry login token
name: Build test push release
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "adr/**"
      - ".vscode/**"
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "adr/**"
      - ".vscode/**"
      - "**.md"
env:
  REGISTRY: docker.io
  REPO: linode/apl-console
jobs:
  build-test-push-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Need write permissions to push GH cache
      actions: write
    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Set tag
        id: set_tag
        run: |
          if [[ "$SHOULD_PUSH" == "true" ]]; then
            # github.ref_name is the merge ref (e.g. "50/merge") on pull_request events, not the
            # actual branch name, so use head_ref there; ref_name is correct for branch/tag pushes.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              ref_name="${{ github.head_ref }}"
            else
              ref_name="${{ github.ref_name }}"
            fi
            # Docker tags allow only [a-zA-Z0-9_.-]; branch/tag names (e.g. "feature/foo") may not, so sanitize.
            tag=$(echo "$ref_name" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          else
            tag="pr-${{ github.event.pull_request.number }}"
          fi
          echo "Creating tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: ${{ env.SHOULD_PUSH == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LINODEBOT_TOKEN }}
      - name: Build, test, push
        uses: docker/build-push-action@v7
        with:
          push: ${{ env.SHOULD_PUSH == 'true' }}
          context: .
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.set_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
